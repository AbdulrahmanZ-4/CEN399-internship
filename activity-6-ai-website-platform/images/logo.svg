<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle (engineering precision) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#f4b942" stroke-width="4" />
  
  <!-- Inner drafting circle -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#0b1f33" stroke-width="2.5" stroke-dasharray="6,4" />
  
  <!-- Drafting crosshairs (engineering guidelines) -->
  <line x1="50" y1="8" x2="50" y2="35" stroke="#0b1f33" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="65" x2="50" y2="92" stroke="#0b1f33" stroke-width="3" stroke-linecap="round" />
  <line x1="8" y1="50" x2="35" y2="50" stroke="#0b1f33" stroke-width="3" stroke-linecap="round" />
  <line x1="65" y1="50" x2="92" y2="50" stroke="#0b1f33" stroke-width="3" stroke-linecap="round" />
  
  <!-- Central structural core (diamond) -->
  <rect x="42" y="42" width="16" height="16" transform="rotate(45 50 50)" fill="#f4b942" stroke="#0b1f33" stroke-width="2.5" />
</svg>
